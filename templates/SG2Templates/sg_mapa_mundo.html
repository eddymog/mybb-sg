		function changeSide(boo)
		{
			deleteButtons();

			if(boo)
				zoomin(8);
			else
				zoomin(7);
		}

		function zoomout() {
			var myImg = document.getElementById("mapImage");
			myImg.src="./../images/map/worldMapSmall.jpeg";
			var back = document.getElementById("world");
			back.style.display = "none";
			var buttons = document.getElementById("buttonParent");
			var subs = buttons.getElementsByClassName('worldBut');
			for(var i = 0; i < subs.length; i++){
				var a = subs[i];
				a.style.display = 'block';
			}
			deleteButtons();
		}

		function deleteButtons()
		{
			var buttonsChild = document.getElementById("buttonChild");
			buttonsChild.innerHTML="";
		}
