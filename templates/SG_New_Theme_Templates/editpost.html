<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->edit_post}</title>
{$headerinclude}
{$post_javascript}
</head>
<body>
{$header}
{$preview}
{$post_errors}
{$attacherror}
{$moderation_notice}
{$deletebox}
<form id="editpost" action="editpost.php?pid={$pid}&amp;processed=1" method="post" enctype="multipart/form-data" name="input">
<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
<table border="0" cellspacing="{$theme['borderwidth']}" cellpadding="{$theme['tablespace']}" class="tborder">
<tr>
<td class="thead" colspan="2"><strong>{$lang->edit_post}</strong></td>
</tr>
<!-- {loginbox} -->
<tr>
<!-- <td class="trow2"><strong>{lang->subject}</strong></td> -->
<td class="trow2" colspan="2">
	<if $prefixselect then><strong style=" margin-right: 114px; ">Prefijo:</strong></if><strong>Título:</strong><br> {$prefixselect}<input type="text" class="textbox" name="subject" size="40" maxlength="85" value="{$subject}" tabindex="1" /><div style=" display: inline; float: right; margin-top: 8px; "><strong>Palabras</strong>: <span id="palabras">0</span></div></td>
</tr>
{$posticons}
<tr>
<!-- <td class="trow2" valign="top"><strong>{$lang->your_message}</strong><br /><div style="text-align: center;">{$smilieinserter}</div></td> -->
<td class="trow2" colspan="2"><strong>Mensaje:</strong><br>
<textarea name="message" id="message" rows="20" cols="70" tabindex="3">{$message}</textarea>
{$codebuttons}
</td>
</tr>
{$editreason}
<!-- {postoptions}
{subscriptionmethod} 
{pollbox} -->
</table>
<!-- {attachbox} -->
<br />
<div align="center"><input type="submit" class="button" name="submitbutton" value="{$lang->update_post}" tabindex="3" accesskey="s" />  <input type="submit" class="button" name="previewpost" value="{$lang->preview_post}" tabindex="4" /></div>
<input type="hidden" name="action" value="do_editpost" />
<input type="hidden" name="attachmentaid" value="" />
<input type="hidden" name="attachmentact" value="" />
</form>
{$footer}
<script>
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
	
async function contarPalabras() {
	await sleep(100);
	console.log('Contar palabras automáticamente.');
	$($('.sceditor-container')[0].children[1].contentDocument.body).on('focus', function() {
	  before = $(this).html();
	}).on('keyup', function() { 
	  if (before != $(this).html()) { $(this).trigger('change'); }
	});

	$($('.sceditor-container')[0].children[1].contentDocument.body).on('change', function() {
		const palabras = $('.sceditor-container')[0].children[1].contentDocument.body.innerText.split('\n').filter(i => i != '').join(' ').split(' ').length;
		// console.log(palabras);
		$('#palabras')[0].innerText = palabras;
	});
}
contarPalabras();
</script>
</body>
</html>
